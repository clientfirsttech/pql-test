# SPDX-License-Identifier: MIT
#
# PQL.Assert functions targeted by pql-odcs, keyed by IR op.
#
# Function names and argument order follow PQL.Assert 0.7.1's lib/functions.tmdl
# on DAX Lib. This file is the only place they appear in pql-odcs: when
# PQL.Assert adds, renames, or reorders a function, only this file changes.
# Known 0.7.1 gaps (and the additive 0.8.0 fixes) are in docs/pql-assert-gap-plan.md.
#
# Each `args` entry names where the argument value comes from (rendered by
# pql_odcs.emit.dax):
#   testName    the generated test name                      -> DAX string
#   tableName   the target table name                        -> DAX string
#   tableRef    the target table                             -> 'Table'
#   columnRef   the target column                            -> 'Table'[Column]
#   columnList  the assertion's `columns`, comma-joined      -> DAX string
#   rowCount    the target table's row count                 -> COUNTROWS('Table')
#   <other>     the assertion argument of that name          -> DAX literal

library: PQL.Assert
min_version: "0.7.1"

ops:
  tbl.exists:
    fn: PQL.Assert.Tbl.ShouldExist
    args: [testName, tableName]
  tbl.has_columns:
    fn: PQL.Assert.Tbl.ShouldHaveColumns
    args: [testName, tableName, columnList]
  tbl.no_extra_columns:
    fn: PQL.Assert.Tbl.ShouldNotHaveExtraColumns
    args: [testName, tableName, columnList]
  tbl.has_rows:
    fn: PQL.Assert.Tbl.ShouldHaveRows
    args: [testName, tableRef]
  tbl.row_count:
    fn: PQL.Assert.Tbl.ShouldHaveRowCount
    args: [testName, tableRef, count]           # table before count
  tbl.more_rows_than:
    fn: PQL.Assert.Tbl.ShouldHaveMoreRowsThan
    args: [testName, threshold, tableRef]       # threshold before table
  tbl.rows_gt:
    fn: PQL.Assert.ShouldBeGreaterThan
    args: [testName, threshold, rowCount]
  tbl.rows_ge:
    fn: PQL.Assert.ShouldBeGreaterOrEqual
    args: [testName, threshold, rowCount]
  tbl.rows_lt:
    fn: PQL.Assert.ShouldBeLessThan
    args: [testName, threshold, rowCount]
  tbl.rows_le:
    fn: PQL.Assert.ShouldBeLessOrEqual
    args: [testName, threshold, rowCount]
  tbl.rows_ne:
    fn: PQL.Assert.ShouldNotEqual
    args: [testName, threshold, rowCount]
  tbl.rows_between:
    fn: PQL.Assert.ShouldBeBetween
    args: [testName, lower, upper, rowCount]
  col.null_rate_at_most:
    # maxPct is a percentage (0-100). v0.1 only emits 0. Col.ShouldNotBeNull is
    # not used: in 0.7.1 it passes when any value is non-null (gap plan C1).
    fn: PQL.Assert.Col.NullRateShouldBeAtMost
    args: [testName, columnRef, maxPct]
  col.distinct:
    fn: PQL.Assert.Col.ShouldBeDistinct
    args: [testName, columnRef]

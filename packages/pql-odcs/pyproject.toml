# SPDX-License-Identifier: MIT
[build-system]
# setuptools >= 77 supports PEP 639 (license = "<SPDX>" + license-files)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pql-odcs"
version = "0.1.0"
description = "Generate PQL.Assert DAX test suites from ODCS data contracts"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["odcs", "data-contract", "bitol", "power-bi", "fabric", "dax", "pql-assert", "testing"]
authors = [
    { name = "Client First Technologies" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Runtime dependencies are limited to MIT / BSD / Apache-2.0 packages; the
# license guardrail CI job fails on anything else.
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "click>=8.1.0",
]

[project.urls]
Homepage   = "https://github.com/clientfirsttech/pql-test/tree/main/packages/pql-odcs"
Repository = "https://github.com/clientfirsttech/pql-test"
Issues     = "https://github.com/clientfirsttech/pql-test/issues"

[project.scripts]
pql-odcs = "pql_odcs.cli:main"

# pql-test discovers extra command groups through this entry point group.
[project.entry-points."pql_test.commands"]
contract = "pql_odcs.cli:contract"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "import-linter>=2.0",
    "pip-licenses>=4.0",
    "build>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pql_odcs*"]

[tool.setuptools.package-data]
pql_odcs = ["catalog/*.yaml", "schemas/*.json", "schemas/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["pql_odcs"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pql_odcs"]

[tool.importlinter]
root_packages = ["pql_odcs"]

[[tool.importlinter.contracts]]
name = "pql-odcs (MIT) never imports pql-test (BUSL-1.1)"
type = "forbidden"
source_modules = ["pql_odcs"]
forbidden_modules = ["pql_test"]

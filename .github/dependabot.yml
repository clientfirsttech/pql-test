# Keep dependencies and workflow actions current; security updates arrive as pull requests.
version: 2
updates:
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Generated by `gh aw compile` ("DO NOT EDIT"): bump its pins by recompiling
    # issue-review-agent.md, not by editing the lock file.
    exclude-paths:
      - .github/workflows/issue-review-agent.lock.yml

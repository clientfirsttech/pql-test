# Copilot Setup Steps
#
# This workflow configures the development environment for the GitHub Copilot
# coding agent when it works on this repository.  It runs once at the start of
# every Copilot coding-agent session.
#
# Docs: https://docs.github.com/en/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent

name: "Copilot Setup Steps"

on: repository_dispatch

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # -----------------------------------------------------------------------
      # 1. Python environment
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 2. Install pql-test and its dependencies
      # -----------------------------------------------------------------------
      - name: Install pql-test package
        run: |
          pip install --upgrade pip
          pip install ./python
          pip install -r python/requirements-dev.txt

      # -----------------------------------------------------------------------
      # 3. Verify installation
      # -----------------------------------------------------------------------
      - name: Verify pql-test is available
        run: |
          pql-test check-prereqs || true
          python -c "import pql_test_cli; print('pql_test_cli imported OK')"
          python -c "import pql_test_runner; print('pql_test_runner imported OK')"

      # -----------------------------------------------------------------------
      # 4. Validate plugin structure
      # -----------------------------------------------------------------------
      - name: Validate plugin.json
        run: |
          python -c "
          import json, pathlib, sys
          p = pathlib.Path('plugin.json')
          if not p.exists():
              print('WARNING: plugin.json not found')
              sys.exit(0)
          data = json.loads(p.read_text())
          for field in ('name', 'description', 'version', 'skills'):
              assert field in data, f'Missing required field: {field}'
          print(f'plugin.json OK — {data[\"name\"]} v{data[\"version\"]}')
          "

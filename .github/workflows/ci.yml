# Master CI pipeline for the pql-test Copilot CLI plugin.
#
# Stage 0 runs alongside stage 1. Stages 1–2 run sequentially; stages 3a, 3b,
# and 3c run in parallel once stage 2 completes.  Any failed stage fails the
# pipeline.
#
#  Stage 0 – security
#    gitleaks on the full history (pinned, checksum-verified), bandit on
#    python/pql_test, pip-audit on the runtime dependencies, and the offline
#    dead-link check of the documentation. No secrets.
#
#  Stage 1 – validate-plugin
#    Static structural validation: plugin.json schema, skill directory layout,
#    SKILL.md frontmatter, and (best-effort) gh copilot CLI install check.
#
#  Stage 2 – promptfoo-eval
#    Sends each skill's instructions to GitHub Models (gpt-4o-mini) via plain
#    Python urllib.request and asserts that the model returns the expected CLI
#    flags and commands.  Uses the built-in GITHUB_TOKEN; no third-party API
#    keys required.  Marked continue-on-error when GitHub Models is unavailable,
#    but the job itself must complete to unblock stage 3.
#
#  Stage 3a – pytest (Windows)
#    Installs pql-test on a Windows runner with ADOMD.NET, then runs the
#    full pytest suite (unit tests + live integration tests against the
#    service-principal credentials).  Tests marked @pytest.mark.live
#    auto-skip when secrets aren't configured.
#
#  Stage 3b – run-tests-remote (Windows)
#    Installs pql-test on a Windows runner (required for ADOMD.NET / pyadomd),
#    discovers every .SemanticModel under examples/, and runs the full DAX
#    test suite against the deployed datasets in the workspace.
#
#  Stage 3c – linux
#    Installs pql-test on ubuntu (no pyadomd) on Python 3.10 and 3.13. Runs the
#    contract and platform tests, smoke-tests the file-based commands, and checks
#    that the XMLA commands stop with one Windows-only message. No secrets.
#
# Required secrets for stage 3:
#   PQL_TENANT_ID         – Azure AD tenant GUID
#   PQL_CLIENT_ID         – Service principal application (client) ID
#   PQL_CLIENT_SECRET     – Service principal client secret
#
# Required repository variable for stage 3:
#   PQL_WORKSPACE_ID      – Power BI workspace GUID (not a secret; GUIDs
#                            aren't sensitive on their own)
#
# Dataset GUIDs are NOT required.  The CLI derives each model's dataset
# display name from its `.SemanticModel` directory and looks it up in the
# workspace via REST at run time.
#
# Optional secrets for stage 3:
#   PQL_ENVIRONMENT    – Cloud environment (Public, USGov, …).  Default: Public.

name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
    # Copilot coding-agent branches run through the pull_request trigger below,
    # where a bot-authored PR gets no secrets (see BOT_PR in stage 3).
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: 'GitHub Models model for promptfoo (e.g. gpt-4o-mini)'
        required: false
        default: 'gpt-4o-mini'
      environment:
        description: 'Power BI cloud environment for DAX tests (Public, USGov, …)'
        required: false
        default: 'Public'

jobs:
  # ---------------------------------------------------------------------------
  # Stage 0: secrets, Python security flaws, vulnerable dependencies, dead links
  # ---------------------------------------------------------------------------
  security:
    name: Stage 0 – Security
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Stage 1: validate plugin structure
  # ---------------------------------------------------------------------------
  validate-plugin:
    name: Stage 1 – Validate plugin structure
    uses: ./.github/workflows/validate-plugin.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Stage 2: skill evaluation via GitHub Models (plain HTTP, no axios)
  # ---------------------------------------------------------------------------
  promptfoo-eval:
    name: Stage 2 – Skill evaluation
    needs: validate-plugin
    uses: ./.github/workflows/promptfoo-eval.yml
    with:
      model: ${{ inputs.model || 'gpt-4o-mini' }}
    permissions:
      contents: read
      models: read

  # ---------------------------------------------------------------------------
  # Stage 3a: pytest suite (unit + live integration tests)
  #
  # Runs in parallel with stage 3b (DAX-against-workspace) because they
  # exercise different code paths: pytest tests the Python implementation
  # (parser, resolver, CLI wiring, auth bridge); run-tests-remote tests
  # the end-to-end DAX execution against the deployed datasets.  Either
  # one failing is a blocker — both must be green.
  # ---------------------------------------------------------------------------
  pytest:
    name: Stage 3a – pytest suite (Windows)
    needs: promptfoo-eval
    uses: ./.github/workflows/pytest.yml
    permissions:
      contents: read
    # BOT_PR: a pull request opened by a bot (the gh-aw issue agent, the Copilot coding
    # agent, Dependabot) carries code no maintainer wrote, so its run gets no secrets.
    # The live tests then skip. A maintainer can run them after review with
    # workflow_dispatch on that branch.
    secrets:
      PQL_TENANT_ID:        ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_TENANT_ID || '' }}
      PQL_CLIENT_ID:        ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_CLIENT_ID || '' }}
      PQL_CLIENT_SECRET:    ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_CLIENT_SECRET || '' }}
      PQL_DATASET_ID:       ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_DATASET_ID || '' }}
      PQL_DATASET_ID_RLS:   ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_DATASET_ID_RLS || '' }}
      PQL_DATASET_ID_OLS:   ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_DATASET_ID_OLS || '' }}
      PQL_ENVIRONMENT:      ${{ (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') && secrets.PQL_ENVIRONMENT || '' }}

  # ---------------------------------------------------------------------------
  # Stage 3b: run DAX tests against the examples/ folder → deployed workspace
  # ---------------------------------------------------------------------------
  run-tests-remote:
    name: Stage 3b – Run DAX tests (Windows, remote workspace)
    needs: promptfoo-eval
    # Skipped for Dependabot (it gets no Actions secrets, so every test would be skipped,
    # a failure) and for any bot-authored pull request (BOT_PR above): this stage needs
    # the secrets.
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot')
    uses: ./.github/workflows/run-tests-remote.yml
    with:
      environment: ${{ inputs.environment || 'Public' }}
    permissions:
      contents: read
    secrets:
      PQL_TENANT_ID:        ${{ secrets.PQL_TENANT_ID }}
      PQL_CLIENT_ID:        ${{ secrets.PQL_CLIENT_ID }}
      PQL_CLIENT_SECRET:    ${{ secrets.PQL_CLIENT_SECRET }}
      PQL_ENVIRONMENT:      ${{ secrets.PQL_ENVIRONMENT }}

  # ---------------------------------------------------------------------------
  # Stage 3c: pql-test on Linux (file-based commands; XMLA commands refuse cleanly)
  # ---------------------------------------------------------------------------
  linux:
    name: Stage 3c – Linux (file-based commands)
    needs: promptfoo-eval
    uses: ./.github/workflows/linux.yml
    permissions:
      contents: read

# Publish pql-odcs (MIT) to PyPI on every `pql-odcs-vX.Y.Z` tag.
#
# pql-odcs releases independently of pql-test: its own version
# (packages/pql-odcs/pyproject.toml), changelog, and tag prefix. pql-test keeps
# release.yml and its `v*` tags. A `pql-odcs-v*` tag does not match `v*`, so the
# two workflows never fire for each other's tags.
#
# Uses PyPI Trusted Publishing (OIDC), as release.yml does. ONE-TIME setup on
# PyPI (and the same on test.pypi.org for rehearsals):
#
#   https://pypi.org/manage/account/publishing/ -> "Add a new pending publisher"
#     PyPI project name : pql-odcs
#     Owner             : clientfirsttech
#     Repository name   : pql-test
#     Workflow name     : release-pql-odcs.yml
#     Environment name  : (leave blank)

name: Release pql-odcs

on:
  push:
    tags:
      - 'pql-odcs-v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish: testpypi (rehearsal) or pypi (real release)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  # Build from packages/pql-odcs only, then run the same license guardrails the
  # pql-odcs CI workflow runs, against the exact artifacts being published.
  build:
    name: Build pql-odcs distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        shell: bash
        working-directory: packages/pql-odcs
        run: |
          # refs/tags/pql-odcs-v0.1.0 -> 0.1.0
          TAG_VERSION="${GITHUB_REF_NAME#pql-odcs-v}"
          PYPROJ_VERSION=$(
            python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          )
          if [ "$TAG_VERSION" != "$PYPROJ_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' (=$TAG_VERSION) does not match packages/pql-odcs/pyproject.toml version '$PYPROJ_VERSION'."
            exit 1
          fi
          echo "Tag matches pql-odcs version: $PYPROJ_VERSION"

      - name: Build sdist + wheel
        run: python -m build packages/pql-odcs --outdir dist

      - name: Wheel holds only pql_odcs/ plus its own LICENSE and NOTICE
        run: python .github/scripts/check_license_boundary.py wheel dist/*.whl

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pql-odcs-dist
          path: dist/

  publish-testpypi:
    name: Publish pql-odcs to TestPyPI
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: pql-odcs-dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish pql-odcs to PyPI
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: pql-odcs-dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

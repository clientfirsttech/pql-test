# Run pql-test against every PBIP model in the examples/ directory, connecting
# to a real Power BI Premium / Microsoft Fabric XMLA endpoint.
#
# Why windows-latest?
#   pyadomd (the ADOMD.NET XMLA driver used by pql-test) requires the
#   Microsoft.AnalysisServices.AdomdClient NuGet package, which is a
#   Windows/.NET component.  The job must run on a Windows runner.
#
# Required secrets (Settings → Secrets and variables → Actions → Secrets):
#   PQL_TENANT_ID         – Azure AD tenant GUID
#   PQL_CLIENT_ID         – Service principal application (client) ID
#   PQL_CLIENT_SECRET     – Service principal client secret
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   PQL_WORKSPACE_ID      – Power BI workspace GUID.  GUIDs aren't sensitive,
#                            so this lives as a variable, not a secret.
#
# Dataset GUIDs are NOT stored anywhere.  The CLI derives the dataset's
# display name from each matrix entry's `.SemanticModel` directory stem
# and looks the dataset up in the workspace via REST at run time.
#
# Optional secrets:
#   PQL_ENVIRONMENT    – Cloud environment (Public, USGov, USGovHigh, DOD,
#                        Germany, China).  Default: Public.
#
# Called from ci.yml as the final stage of the sequential pipeline, and can
# also be triggered manually via workflow_dispatch for one-off remote runs.

name: Run DAX Tests (Remote Workspace)

on:
  # Called by ci.yml after validate-plugin and promptfoo-eval succeed
  workflow_call:
    secrets:
      PQL_TENANT_ID:
        required: true
      PQL_CLIENT_ID:
        required: true
      PQL_CLIENT_SECRET:
        required: true
      PQL_ENVIRONMENT:
        required: false
    inputs:
      environment:
        description: 'Power BI cloud environment override'
        type: string
        required: false
        default: 'Public'

  # Manual trigger so the workflow can be run stand-alone for ad-hoc testing
  workflow_dispatch:
    inputs:
      environment:
        description: 'Power BI cloud environment (Public, USGov, USGovHigh, DOD, Germany, China)'
        required: false
        default: 'Public'
      test_name:
        description: 'Run only a specific test suite (leave blank for all)'
        required: false
        default: ''
      verbose:
        description: 'Enable verbose output'
        type: boolean
        required: false
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: discover all PBIP models in examples/ and emit a matrix
  # ---------------------------------------------------------------------------
  discover-models:
    name: Discover example PBIP models
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      models: ${{ steps.find-models.outputs.models }}
      model_count: ${{ steps.find-models.outputs.model_count }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Find PBIP SemanticModel directories
        id: find-models
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, sys

          repo_root = pathlib.Path('.')
          # Collect every .SemanticModel directory under examples/
          models = sorted(
              str(p).replace('\\', '/')
              for p in repo_root.glob('examples/**/*.SemanticModel')
              if p.is_dir()
          )

          if not models:
              print('::warning::No .SemanticModel directories found in examples/')
              models = []

          print(f'Found {len(models)} model(s):')
          for m in models:
              print(f'  • {m}')

          # Write outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f'models={json.dumps(models)}\n')
              fh.write(f'model_count={len(models)}\n')
          PYEOF

      - name: Show discovered models
        env:
          MODELS: ${{ steps.find-models.outputs.models }}
          MODEL_COUNT: ${{ steps.find-models.outputs.model_count }}
        run: |
          echo "Models to test: $MODELS"
          echo "Total: $MODEL_COUNT"

  # ---------------------------------------------------------------------------
  # Stage 2: run pql-test against each discovered model (matrix)
  # ---------------------------------------------------------------------------
  run-dax-tests:
    name: DAX tests – ${{ matrix.model }}
    needs: discover-models
    if: ${{ needs.discover-models.outputs.model_count != '0' }}
    runs-on: windows-latest   # pyadomd (ADOMD.NET) requires Windows + .NET
    permissions:
      contents: read

    strategy:
      # Run all models even if one fails so we get complete results
      fail-fast: false
      matrix:
        model: ${{ fromJson(needs.discover-models.outputs.models) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # -----------------------------------------------------------------------
      # Python environment
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install pql-test and dependencies
        shell: bash
        run: |
          # pip 26.1+ refuses self-upgrade via `pip install --upgrade pip`
          # and requires the `python -m pip` form to avoid the Windows
          # exe-replacement race.  Use that form for forward compatibility.
          python -m pip install --upgrade pip
          pip install ./python

      # -----------------------------------------------------------------------
      # Install Microsoft.AnalysisServices.AdomdClient via NuGet so pyadomd
      # can find the native ADOMD.NET assemblies on the runner.
      #
      # We install the modern, actively-maintained package
      # `Microsoft.AnalysisServices.AdomdClient` (NOT the legacy
      # `.retail.amd64` flavour, which stopped at 19.84.1).  Older 19.84.x
      # releases mishandle the combination of (bearer-token auth + `Roles=`
      # + a role containing a row-filter expression), which caused the
      # RLS_Model CI job to fail with "Either the database '<name>' does
      # not exist..." even though the SPN had Admin on the workspace and
      # the role's filter was valid.  Verified locally that 19.114.0
      # resolves the query successfully against the same dataset.
      # -----------------------------------------------------------------------
      - name: Install ADOMD.NET client libraries
        shell: pwsh
        run: |
          # Use nuget.exe (pre-installed on windows-latest) instead of the
          # PowerShell PackageManagement provider, which can fail to locate
          # the NuGet provider on newer runner images.
          $outputDir = Join-Path $env:USERPROFILE '.nuget' 'packages'
          nuget install Microsoft.AnalysisServices.AdomdClient `
            -Version 19.114.0 `
            -OutputDirectory $outputDir `
            -NonInteractive
          if ($LASTEXITCODE -eq 0) {
            $installed = Get-ChildItem $outputDir -Directory `
              | Where-Object Name -like 'Microsoft.AnalysisServices.AdomdClient*' `
              | Select-Object -First 1
            Write-Host "ADOMD.NET installed: $($installed.Name)"
          } else {
            Write-Warning "ADOMD.NET package install failed – pyadomd may still work if assemblies are in the GAC"
          }

      # -----------------------------------------------------------------------
      # Build result filename from the model path (safe for artifacts)
      # -----------------------------------------------------------------------
      - name: Compute result filename
        id: result-name
        shell: bash
        env:
          MODEL: ${{ matrix.model }}
        run: |
          SAFE=$(echo "$MODEL" | tr '/\\. ' '----')
          echo "filename=dax-results-${SAFE}.json" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Run pql-test.
      #
      # The CLI derives the dataset's display name from the matrix entry's
      # `.SemanticModel` directory stem (e.g. `examples/RLS_Model.SemanticModel`
      # → "RLS_Model") and looks it up in the workspace via the Power BI
      # REST API at run time.  No dataset GUIDs are stored as secrets.
      # -----------------------------------------------------------------------
      - name: Run DAX tests for ${{ matrix.model }}
        id: run-tests
        shell: bash
        # Inputs reach the script as environment variables, never as ${{ }} in the
        # script text, so a crafted value cannot inject shell commands.
        env:
          MODEL: ${{ matrix.model }}
          RESULT_FILE: ${{ steps.result-name.outputs.filename }}
          TEST_NAME: ${{ inputs.test_name }}
          VERBOSE: ${{ inputs.verbose }}
          PQL_TENANT_ID:     ${{ secrets.PQL_TENANT_ID }}
          PQL_WORKSPACE_ID:  ${{ vars.PQL_WORKSPACE_ID }}
          PQL_CLIENT_ID:     ${{ secrets.PQL_CLIENT_ID }}
          PQL_CLIENT_SECRET: ${{ secrets.PQL_CLIENT_SECRET }}
          # Use the secret if set; fall back to the input (or default Public)
          PQL_ENVIRONMENT:   ${{ secrets.PQL_ENVIRONMENT || inputs.environment || 'Public' }}
        run: |
          ARGS=("$MODEL")
          ARGS+=(--log-format github)
          ARGS+=(--output "$RESULT_FILE")

          # Optional: single test suite (workflow_dispatch only)
          if [ -n "$TEST_NAME" ]; then
            ARGS+=(--test "$TEST_NAME")
          fi

          # Optional: verbose output (workflow_dispatch only)
          if [ "$VERBOSE" = "true" ]; then
            ARGS+=(--verbose)
          fi

          echo "Running: pql-test run-tests ${ARGS[*]}"
          set +e
          pql-test run-tests "${ARGS[@]}"
          rc=$?
          set -e

          # SampleModel.SemanticModel intentionally fails 15 assertions
          # (47 passed / 15 failed is the documented expected outcome —
          # the failures demo the framework catching real model-quality
          # issues).  Pin that matrix entry to the exact baseline: a
          # match treats pql-test's non-zero exit as success; any drift
          # (fewer failures, more failures, different pass count, missing
          # results file) gates CI so the baseline can't silently shift.
          # Every other model propagates pql-test's exit code verbatim.
          case "$MODEL" in
            *SampleModel.SemanticModel*)
              python - <<'PYEOF'
          import json, os, pathlib, sys
          expected_passed, expected_failed = 47, 15
          results = pathlib.Path(os.environ["RESULT_FILE"])
          if not results.exists():
              print("::error::SampleModel results file missing — cannot verify baseline.")
              sys.exit(1)
          data = json.loads(results.read_text(encoding="utf-8"))
          actual_passed = int(data.get("passed", 0))
          actual_failed = int(data.get("failed", 0))
          if actual_passed == expected_passed and actual_failed == expected_failed:
              print(
                  f"::warning::SampleModel matches documented baseline "
                  f"({expected_passed} passed / {expected_failed} failed) — "
                  "failures are intentional. Treating as success."
              )
              sys.exit(0)
          print(
              f"::error::SampleModel result drift: expected "
              f"{expected_passed} passed / {expected_failed} failed, got "
              f"{actual_passed} passed / {actual_failed} failed. "
              "Update the baseline in run-tests-remote.yml if this drift is intentional."
          )
          sys.exit(1)
          PYEOF
              ;;
            *)
              exit $rc
              ;;
          esac

      # -----------------------------------------------------------------------
      # Upload the JSON results file so they are available as pipeline artifacts
      # -----------------------------------------------------------------------
      - name: Upload test results
        if: always() && steps.result-name.outputs.filename != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.result-name.outputs.filename }}
          path: ${{ steps.result-name.outputs.filename }}
          if-no-files-found: warn

      # -----------------------------------------------------------------------
      # Print a brief summary to the Actions log
      # -----------------------------------------------------------------------
      - name: Summarise results
        if: always() && steps.result-name.outputs.filename != ''
        shell: python
        env:
          MODEL: ${{ matrix.model }}
          RESULT_FILE: ${{ steps.result-name.outputs.filename }}
        run: |
          import json, pathlib, sys, os

          
          # Force UTF-8 on stdout so Unicode glyphs (e.g. ✗) don't crash the
          # step on Windows runners, where stdout defaults to cp1252.
          sys.stdout.reconfigure(encoding="utf-8")

          results_path = os.environ.get("RESULT_FILE", "")
          if not results_path:
              print("No result filename set – earlier steps may have been skipped.")
              sys.exit(0)

          results_file = pathlib.Path(results_path)
          if not results_file.exists():
              print("No results file produced – the run-tests step may have failed before writing output.")
              sys.exit(0)

          data = json.loads(results_file.read_text(encoding="utf-8"))
          passed  = data.get("passed",  0)
          failed  = data.get("failed",  0)
          skipped = data.get("skipped", 0)
          total   = data.get("total",   0)

          print(f"\nModel : {os.environ['MODEL']}")
          print(f"Passed : {passed}/{total}")
          print(f"Failed : {failed}")
          print(f"Skipped: {skipped}")

          if failed:
              print("\nFailed tests:")
              for r in data.get("results", []):
                  if not r.get("passed") and not r.get("skipped"):
                      print(f"  ✗  [{r['suite_name']}] {r['test_name']}")
                      if r.get("error"):
                          print(f"       error: {r['error']}")
                      else:
                          print(f"       expected : {r.get('expected')}")
                          print(f"       actual   : {r.get('actual')}")

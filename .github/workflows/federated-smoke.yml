# Manual end-to-end check of the federated-credential (workload identity) example in
# CONTRIBUTING.md, "Federated credentials". No client secret is used anywhere: the job
# asks GitHub for an OIDC token, `pql-test auth login` exchanges it for an Entra token,
# and `run-tests` connects with that.
#
# One-time setup before the first run: run `scripts/setup-federated-smoke.ps1` (see its
# help; add -DryRun first), which does everything below. Or do it by hand:
#   1. App registration: add a federated credential with
#        issuer   https://token.actions.githubusercontent.com
#        subject  repo:<owner>/<repo>:environment:federated-smoke
#        audience api://AzureADTokenExchange   (the default)
#      and give the app Viewer (or Contributor) on the test workspace.
#   2. GitHub: create the Environment `federated-smoke` (add required reviewers), and
#      set the variables PQL_TENANT_ID, PQL_CLIENT_ID, PQL_WORKSPACE_ID on it.
#
# It is manual (workflow_dispatch) on purpose: it needs that Entra setup, and the
# narrow `environment:` subject means no pull request can obtain the token.

name: Federated credential smoke test

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'PBIP semantic model to run (must exist in the workspace and pass)'
        required: false
        default: 'examples/RLS_Model.SemanticModel'

permissions:
  id-token: write   # request the OIDC token
  contents: read

jobs:
  federated-smoke:
    runs-on: windows-latest   # pyadomd (ADOMD.NET) requires Windows + .NET
    environment: federated-smoke
    steps:
      - name: Check the Environment variables
        shell: bash
        env:
          PQL_CLIENT_ID: ${{ vars.PQL_CLIENT_ID }}
          PQL_TENANT_ID: ${{ vars.PQL_TENANT_ID }}
          PQL_WORKSPACE_ID: ${{ vars.PQL_WORKSPACE_ID }}
        run: |
          for v in PQL_CLIENT_ID PQL_TENANT_ID PQL_WORKSPACE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Environment variable $v is empty. Run the setup script in scripts/ or set it on the Environment (see this file's header)."
              exit 1
            fi
          done

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pql-test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ./python

      - name: Install ADOMD.NET client libraries
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:USERPROFILE '.nuget' 'packages'
          nuget install Microsoft.AnalysisServices.AdomdClient `
            -Version 19.114.0 `
            -OutputDirectory $outputDir `
            -NonInteractive

      # Request the OIDC token without a third-party action. Mask it first, then pass
      # it through the environment (never a file or a command-line argument).
      - name: Get OIDC token
        shell: bash
        run: |
          set -euo pipefail
          resp=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")
          token=$(python -c "import json,sys; print(json.load(sys.stdin)['value'])" <<< "$resp")
          echo "::add-mask::$token"
          echo "PQL_FEDERATED_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Sign in with the federated credential
        shell: bash
        env:
          PQL_CLIENT_ID: ${{ vars.PQL_CLIENT_ID }}
          PQL_TENANT_ID: ${{ vars.PQL_TENANT_ID }}
        run: |
          pql-test auth login --client-id "$PQL_CLIENT_ID" --tenant-id "$PQL_TENANT_ID"
          pql-test auth status

      - name: Run tests with the federated sign-in
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          # Do not set PQL_TENANT_ID / PQL_CLIENT_ID here: any of them makes the runner use
          # environment credentials and skip the stored federated sign-in.
          PQL_WORKSPACE_ID: ${{ vars.PQL_WORKSPACE_ID }}
        run: |
          pql-test run-tests "$MODEL" --log-format github

# -----------------------------------------------------------------------------
# pql-test-remote.yml
#
# Reusable GitHub Actions workflow that runs pql-test DAX tests against a
# Fabric / Power BI Premium workspace via the XMLA endpoint.
#
# Inputs:
#   workspace_name  (required) — Fabric workspace display name.
#   dataset_name    (optional) — Semantic model display name. If omitted,
#                                the workflow discovers and tests every
#                                semantic model in the workspace.
#   environment     (optional) — Test-tag filter (matches pql-test --env,
#                                e.g. DEV, PROD, UAT). Semantics:
#                                  • not provided → run "ANY" and "PROD"
#                                  • provided     → run "ANY" and <value>
#                                (Two runs per model.)
#
# Required repository / environment secrets:
#   PQL_TENANT_ID       — Azure AD tenant GUID.
#   PQL_CLIENT_ID       — Service principal application (client) ID.
#   PQL_CLIENT_SECRET   — Service principal client secret.
#
# Optional:
#   PQL_ENVIRONMENT     — Cloud (Public, USGov, USGovHigh, DOD, Germany,
#                          China). Defaults to Public.
#
# Notes:
#   • Windows runner is mandatory: pyadomd (ADOMD.NET) is Windows/.NET only.
#   • Fabric workspace item names are unique per workspace with a
#     case-insensitive uniqueness check — dataset matching is therefore
#     safely case-insensitive.
#   • This workflow is self-contained: no `uses: ./…` composite actions,
#     no template references, no external scripts. Upload and adopt as-is.
# -----------------------------------------------------------------------------

name: pql-test (remote workspace)

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: 'Fabric workspace display name'
        type: string
        required: true
      dataset_name:
        description: 'Semantic model display name (blank = all models in workspace)'
        type: string
        required: false
        default: ''
      environment:
        description: 'Test-tag environment (blank = ANY + PROD; else ANY + <value>)'
        type: string
        required: false
        default: ''

  workflow_call:
    inputs:
      workspace_name:
        type: string
        required: true
      dataset_name:
        type: string
        required: false
        default: ''
      environment:
        type: string
        required: false
        default: ''
    secrets:
      PQL_TENANT_ID:
        required: true
      PQL_CLIENT_ID:
        required: true
      PQL_CLIENT_SECRET:
        required: true
      PQL_ENVIRONMENT:
        required: false

jobs:
  run:
    name: Run DAX tests
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      PQL_TENANT_ID:     ${{ secrets.PQL_TENANT_ID }}
      PQL_CLIENT_ID:     ${{ secrets.PQL_CLIENT_ID }}
      PQL_CLIENT_SECRET: ${{ secrets.PQL_CLIENT_SECRET }}
      PQL_ENVIRONMENT:   ${{ secrets.PQL_ENVIRONMENT || 'Public' }}
      WORKSPACE_NAME:    ${{ inputs.workspace_name }}
      DATASET_NAME:      ${{ inputs.dataset_name }}
      TEST_ENVIRONMENT:  ${{ inputs.environment }}

    steps:
      # ---------------------------------------------------------------------
      # 1. Runtime setup
      # ---------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pql-test and Fabric CLI
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pql-test ms-fabric-cli

      # ---------------------------------------------------------------------
      # 2. ADOMD.NET client libraries (required by pyadomd on Windows)
      # ---------------------------------------------------------------------
      - name: Install ADOMD.NET client libraries
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:USERPROFILE '.nuget' 'packages'
          nuget install Microsoft.AnalysisServices.AdomdClient `
            -Version 19.114.0 `
            -OutputDirectory $outputDir `
            -NonInteractive
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "ADOMD.NET install failed - pyadomd may still find assemblies in the GAC"
          }

      # ---------------------------------------------------------------------
      # 3. Fabric CLI service-principal login
      # ---------------------------------------------------------------------
      - name: Fabric CLI login (service principal)
        shell: pwsh
        run: |
          fab config set encryption_fallback_enabled true | Out-Null
          fab auth login `
            --username $env:PQL_CLIENT_ID `
            --password $env:PQL_CLIENT_SECRET `
            --tenant   $env:PQL_TENANT_ID
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error title=Fabric CLI login failed::Verify PQL_TENANT_ID / PQL_CLIENT_ID / PQL_CLIENT_SECRET secrets and that the service principal is allowed to sign in."
            exit 1
          }

      # ---------------------------------------------------------------------
      # 4. Validate workspace and resolve dataset list (case-insensitive)
      # ---------------------------------------------------------------------
      - name: Validate workspace and resolve dataset list
        id: resolve
        shell: bash
        run: |
          python - <<'PYEOF'
          import json, os, re, subprocess, sys

          workspace = os.environ["WORKSPACE_NAME"].strip()
          dataset   = os.environ.get("DATASET_NAME", "").strip()

          def emit_error(title, msg):
              print(f"::error title={title}::{msg}")

          def run_fab(args):
              proc = subprocess.run(
                  ["fab"] + args,
                  capture_output=True, text=True, shell=False,
              )
              return proc.returncode, proc.stdout, proc.stderr

          # ---- list workspaces ------------------------------------------------
          rc, out, err = run_fab(["ls"])
          if rc != 0:
              emit_error("Workspace list failed",
                         f"`fab ls /` exited {rc}. stderr: {err.strip() or '(empty)'}")
              sys.exit(1)

          # `fab ls` prints one entry per line; workspaces end in `.Workspace`.
          # Strip ANSI codes, indent, and any trailing type marker for matching.
          ansi = re.compile(r"\x1b\[[0-9;]*[a-zA-Z]")
          def clean(line):
              return ansi.sub("", line).strip().rstrip("/")

          ws_lines = [clean(l) for l in out.splitlines() if l.strip()]
          workspaces = []
          for l in ws_lines:
              # Accept both "Foo.Workspace" and bare "Foo" listings.
              name = l[:-len(".Workspace")] if l.endswith(".Workspace") else l
              workspaces.append(name)

          match = next(
              (w for w in workspaces if w.casefold() == workspace.casefold()),
              None,
          )
          if match is None:
              emit_error(
                  "Workspace not found",
                  f"Service principal cannot see a workspace named '{workspace}'. "
                  f"Visible workspaces: {', '.join(workspaces) or '(none)'}",
              )
              sys.exit(1)
          workspace = match  # use canonical casing returned by Fabric
          print(f"::notice title=Workspace validated::{workspace}")

          # ---- list semantic models in the workspace --------------------------
          rc, out, err = run_fab(["ls", f"{workspace}.Workspace"])
          if rc != 0:
              emit_error(
                  "Dataset list failed",
                  f"`fab ls '{workspace}.Workspace'` exited {rc}. "
                  f"stderr: {err.strip() or '(empty)'}",
              )
              sys.exit(1)

          items = [clean(l) for l in out.splitlines() if l.strip()]
          sem_models = [
              i[:-len(".SemanticModel")] for i in items
              if i.endswith(".SemanticModel")
          ]

          if dataset:
              hit = next(
                  (m for m in sem_models if m.casefold() == dataset.casefold()),
                  None,
              )
              if hit is None:
                  emit_error(
                      "Dataset not found",
                      f"Semantic model '{dataset}' not found in workspace "
                      f"'{workspace}'. Available: {', '.join(sem_models) or '(none)'}",
                  )
                  sys.exit(1)
              models = [hit]
              print(f"::notice title=Dataset validated::{hit}")
          else:
              if not sem_models:
                  emit_error(
                      "No semantic models",
                      f"Workspace '{workspace}' contains no .SemanticModel items.",
                  )
                  sys.exit(1)
              models = sem_models
              print(f"::notice title=Discovered models::{len(models)} in '{workspace}'")
              for m in models:
                  print(f"  - {m}")

          # ---- emit outputs ---------------------------------------------------
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"workspace={workspace}\n")
              fh.write(f"models={json.dumps(models)}\n")
          PYEOF

      # ---------------------------------------------------------------------
      # 5. Run pql-test for each (model, env-tag) pair
      # ---------------------------------------------------------------------
      - name: Run pql-test
        id: run
        shell: bash
        env:
          RESOLVED_WORKSPACE: ${{ steps.resolve.outputs.workspace }}
          RESOLVED_MODELS:    ${{ steps.resolve.outputs.models }}
        run: |
          mkdir -p results
          python - <<'PYEOF'
          import json, os, subprocess, sys, pathlib

          workspace = os.environ["RESOLVED_WORKSPACE"]
          models    = json.loads(os.environ["RESOLVED_MODELS"])
          env_input = os.environ.get("TEST_ENVIRONMENT", "").strip()

          # Two runs per model: ANY + (PROD | user-supplied).
          env_tags = ["ANY", env_input.upper() if env_input else "PROD"]
          # De-duplicate if the caller supplies ANY explicitly.
          seen, ordered = set(), []
          for t in env_tags:
              if t not in seen:
                  seen.add(t)
                  ordered.append(t)
          env_tags = ordered

          overall_failed_runs = 0
          overall_tests_run   = 0
          summary_rows        = []

          for model in models:
              model_path = f"{workspace}.Workspace/{model}.SemanticModel"
              for tag in env_tags:
                  safe = "".join(c if c.isalnum() else "-" for c in f"{model}-{tag}")
                  out_file = pathlib.Path("results") / f"dax-results-{safe}.json"
                  print(f"::group::{model} / --env {tag}")
                  cmd = [
                      "pql-test", "run-tests", model_path,
                      "--env", tag,
                      "--log-format", "github",
                      "--output", str(out_file),
                  ]
                  print("+ " + " ".join(cmd))
                  proc = subprocess.run(cmd)
                  rc = proc.returncode

                  passed = failed = total = 0
                  if out_file.exists():
                      try:
                          data = json.loads(out_file.read_text(encoding="utf-8"))
                          passed = int(data.get("passed", 0))
                          failed = int(data.get("failed", 0))
                          total  = int(data.get("total", passed + failed))
                      except Exception as ex:
                          print(f"::warning title=Result parse failed::{out_file}: {ex}")

                  overall_tests_run += total
                  if rc != 0:
                      overall_failed_runs += 1

                  summary_rows.append({
                      "model": model, "env": tag, "rc": rc,
                      "passed": passed, "failed": failed, "total": total,
                  })
                  print("::endgroup::")

          # ---- step summary ---------------------------------------------------
          lines = [
              f"# pql-test results — `{workspace}`",
              "",
              "| Model | Env | Passed | Failed | Total | Exit |",
              "| --- | --- | ---: | ---: | ---: | ---: |",
          ]
          for r in summary_rows:
              lines.append(
                  f"| {r['model']} | {r['env']} | {r['passed']} | "
                  f"{r['failed']} | {r['total']} | {r['rc']} |"
              )
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")

          # ---- final annotations ---------------------------------------------
          if overall_tests_run == 0:
              print(
                  "::warning title=No tests executed::"
                  "No DAX tests ran across any (model, env) combination. "
                  "Check that *.Tests.dax files exist and their tags match "
                  f"one of: {', '.join(env_tags)}."
              )

          if overall_failed_runs > 0:
              print(f"::error title=DAX test failures::{overall_failed_runs} run(s) failed.")
              sys.exit(1)
          PYEOF

      # ---------------------------------------------------------------------
      # 6. Publish result JSON files as pipeline artifacts
      # ---------------------------------------------------------------------
      - name: Upload result artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dax-results
          path: results/*.json
          if-no-files-found: warn

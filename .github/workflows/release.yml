# Publish pql-test to PyPI on every `vX.Y.Z` tag.
#
# Uses PyPI's "Trusted Publishing" (OIDC) instead of an API token, so no
# secrets are stored in this repo.  Configuration steps required ONCE on
# PyPI before the first run of this workflow:
#
#   1. https://pypi.org/manage/account/publishing/
#   2. "Add a new pending publisher" with:
#        PyPI project name : pql-test
#        Owner             : clientfirsttech
#        Repository name   : pql-test
#        Workflow name     : release.yml
#        Environment name  : (leave blank)
#   3. After the first successful release the publisher transitions from
#      "pending" to fully active.
#
# Same dance against test.pypi.org for the TestPyPI dry-run path.
#
# NOTE: we deliberately do NOT use a GitHub Environment here — they require
# a paid plan on private repos, and trusted publishing works fine without
# one (the OIDC claim matches on repo + workflow filename alone).  If you
# later want a manual-approval gate on production releases, create a `pypi`
# environment, add it back as `environment: name: pypi` on publish-pypi,
# and set the Environment name in the PyPI publisher config to match.
#
# Release cadence:
#   * Bump version in python/pyproject.toml
#   * Commit, tag `vX.Y.Z` (must match the pyproject version), push tag
#   * This workflow builds + uploads automatically

name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish: testpypi (rehearsal) or pypi (real release)'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

jobs:
  # ---------------------------------------------------------------------------
  # Build the wheel + sdist on a hermetic runner and upload them as an
  # artifact for the publish job to consume.  Splitting build from publish
  # keeps the credential-bearing step minimal.
  # ---------------------------------------------------------------------------
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: pip install --upgrade build twine

      - name: Verify tag matches pyproject version
        if: github.event_name == 'push'
        shell: bash
        working-directory: python
        run: |
          # Strip the leading 'v' from the tag (refs/tags/v0.1.0 → 0.1.0)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJ_VERSION=$(
            python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])"
          )
          if [ "$TAG_VERSION" != "$PYPROJ_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' (=$TAG_VERSION) does not match pyproject.toml version '$PYPROJ_VERSION'. Bump the version or retag."
            exit 1
          fi
          echo "Tag matches pyproject version: $PYPROJ_VERSION"

      - name: Build sdist + wheel
        working-directory: python
        run: python -m build

      - name: Validate distribution metadata
        working-directory: python
        run: twine check --strict dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: python/dist/

  # ---------------------------------------------------------------------------
  # Publish to TestPyPI — for workflow_dispatch rehearsals.
  # Skipped on tag pushes (those go to real PyPI via the `publish` job).
  # ---------------------------------------------------------------------------
  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish to real PyPI on tag pushes (and manual dispatch with target=pypi).
  # ---------------------------------------------------------------------------
  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for trusted publishing
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

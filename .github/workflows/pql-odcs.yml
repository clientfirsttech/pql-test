# pql-odcs (MIT) CI: license-boundary guardrails, cross-platform tests, and install checks.
#
# All jobs are blocking. The license guardrails also cover python/ (SPDX headers),
# so this workflow runs on every pull request, not only on packages/pql-odcs changes.
# See LICENSES.md for the boundary these checks enforce.

name: pql-odcs

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-guardrails:
    name: License boundary guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: SPDX headers (python/ = BUSL-1.1, packages/pql-odcs/ = MIT)
        run: python .github/scripts/check_license_boundary.py spdx

      - name: Install pql-odcs and guardrail tooling
        run: pip install ./packages/pql-odcs import-linter pip-licenses build

      - name: Import boundary (pql_odcs must never import pql_test)
        run: lint-imports --config packages/pql-odcs/pyproject.toml

      - name: Build the pql-odcs wheel from packages/pql-odcs only
        run: python -m build packages/pql-odcs --outdir dist-odcs

      - name: Wheel contents (only pql_odcs/ plus its own LICENSE and NOTICE)
        run: python .github/scripts/check_license_boundary.py wheel dist-odcs/*.whl

      - name: Dependency licenses (MIT, BSD, Apache-2.0; PSF-2.0 for typing-extensions)
        shell: bash
        run: |
          # Every package pql-odcs pulls in at runtime, resolved from installed metadata.
          deps=$(python - <<'EOF'
          import re
          from importlib.metadata import requires
          from packaging.markers import Marker
          seen, todo = set(), ["pql-odcs"]
          while todo:
              name = todo.pop()
              key = name.lower().replace("_", "-")
              if key in seen:
                  continue
              seen.add(key)
              for req in requires(name) or []:
                  marker = req.split(";", 1)[1] if ";" in req else None
                  if marker and not Marker(marker).evaluate({"extra": ""}):
                      continue
                  todo.append(re.split(r"[<>=!~\[; (]", req, maxsplit=1)[0])
          seen.discard("pql-odcs")
          print(" ".join(sorted(seen)))
          EOF
          )
          echo "Runtime dependencies: $deps"
          # typing-extensions (via jsonschema -> referencing) is PSF-2.0, a permissive license;
          # it is allowed explicitly. Anything else must be MIT, BSD, or Apache.
          pip-licenses --from=mixed --packages $deps --partial-match --allow-only "MIT;BSD;Apache;PSF"

  tests:
    name: pql-odcs tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install pql-odcs with dev extras
        run: pip install "./packages/pql-odcs[dev]"

      - name: Unit, golden, trace, and property tests
        working-directory: packages/pql-odcs
        run: pytest --cov=pql_odcs --cov-report=term-missing

  standalone-install:
    name: Standalone install (no pql-test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pql-odcs into a clean venv
        run: |
          python -m venv /tmp/odcs
          /tmp/odcs/bin/pip install ./packages/pql-odcs

      - name: pql-test is not installed
        run: /tmp/odcs/bin/python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('pql_test') is not None)"

      - name: CLI smoke tests
        run: |
          set -e
          F=packages/pql-odcs/tests/fixtures
          /tmp/odcs/bin/pql-odcs --version
          /tmp/odcs/bin/pql-odcs lint $F/marvel.odcs.yaml --model examples/SampleModel.SemanticModel
          /tmp/odcs/bin/pql-odcs coverage $F/every-row.odcs.yaml --format json > /tmp/coverage.json
          /tmp/odcs/bin/python -c "import json; r = json.load(open('/tmp/coverage.json')); assert r['summary']['total'] == len(r['rules']) > 0"
          /tmp/odcs/bin/pql-odcs generate $F/marvel.odcs.yaml examples --env DEV --dry-run | grep -q "EVALUATE Marvel.Schema.DEV.Tests()"
          # Exit code 1 is the contract: every-row has rules that v0.1 skips.
          if /tmp/odcs/bin/pql-odcs coverage $F/every-row.odcs.yaml --fail-on-skipped > /dev/null; then
            echo "::error::--fail-on-skipped should exit 1 for every-row.odcs.yaml"; exit 1
          fi

  plugin-install:
    name: pql-test[contracts] plugin install
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pql-odcs from source, then pql-test with the contracts extra
        # pql-odcs is installed from the local path first so the `contracts`
        # extra resolves to it instead of PyPI.
        run: pip install ./packages/pql-odcs "./python[contracts]"

      - name: pql-test contract --help lists every command
        shell: bash
        env:
          PQL_TEST_STRICT_PLUGINS: '1'   # fail loudly if the plugin cannot load
        run: |
          set -e
          help=$(pql-test contract --help)
          echo "$help"
          for cmd in generate coverage lint trace run; do
            echo "$help" | grep -qE "^  $cmd " || { echo "::error::pql-test contract is missing '$cmd'"; exit 1; }
          done

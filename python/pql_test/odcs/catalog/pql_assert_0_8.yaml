#
# PQL.Assert 0.8.0 additions. Every 0.7 op is inherited unchanged; this file only
# adds ops, so a model on 0.8.0 keeps every 0.7.1 function. Selected with
# `--pql-assert 0.8`. Function names and signatures follow the released PQL.Assert
# 0.8.0 package; tests/test_library_conformance.py checks them against a vendored copy.
#
# Extra argument sources beyond the 0.7 catalog:
#   keyProjection  the assertion's `columns` as SELECTCOLUMNS over the table

library: PQL.Assert
min_version: "0.8.0"
extends: pql_assert_0_7

ops:
  col.null_count_at_most:
    # True nulls only (ISBLANK); maxCount 0 is "no row is null" (gap plan C1 / R4).
    fn: PQL.Assert.Col.NullCountShouldBeAtMost
    args: [testName, tableRef, columnRef, maxCount]
  col.null_pct_at_most:
    # Correct row-based rate; maxPct is a percentage (0-100) (gap plan C2).
    fn: PQL.Assert.Col.NullRateShouldBeAtMostV2
    args: [testName, tableRef, columnRef, maxPct]
  col.non_null_distinct:
    # NULLs are ignored and "" counts as a value, as in ODCS unique / duplicateValues 0.
    fn: PQL.Assert.Col.NonNullValuesShouldBeDistinct
    args: [testName, columnRef]
  col.primary_key:
    fn: PQL.Assert.Col.ShouldBePrimaryKey
    args: [testName, columnRef]
  col.duplicates_at_most:
    fn: PQL.Assert.Col.DuplicateCountShouldBeAtMost
    args: [testName, columnRef, maxCount]
  tbl.rows_not_between:
    fn: PQL.Assert.ShouldNotBeBetween
    args: [testName, lower, upper, rowCount]
  tbl.rows_distinct:
    fn: PQL.Assert.Tbl.RowsShouldBeDistinct
    args: [testName, keyProjection]
  # Pattern checks skip NULL rows. The mapper passes matchCase "Y" so the comparison is
  # case-sensitive, like the ODCS regex (PQL.Assert's default is case-insensitive).
  col.starts_with:
    fn: PQL.Assert.Col.ShouldStartWith
    args: [testName, columnRef, text, matchCase]
  col.ends_with:
    fn: PQL.Assert.Col.ShouldEndWith
    args: [testName, columnRef, text, matchCase]
  col.contains:
    fn: PQL.Assert.Col.ShouldContainString
    args: [testName, columnRef, text, matchCase]
  col.max_date_within_days:
    fn: PQL.Assert.Col.MaxDateShouldBeWithinDays
    args: [testName, columnRef, maxAgeDays]

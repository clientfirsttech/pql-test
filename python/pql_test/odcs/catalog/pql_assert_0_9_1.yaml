#
# PQL.Assert 0.9.1: one override. Every 0.9 op is inherited unchanged; this file only gives
# `rel.settings` the two optional arguments PQL.Assert 0.9.1 added to
# Relationship.ShouldExist (crossFilteringBehavior, isActive), and 0.9.1 also reports a
# limited relationship's security filter as None instead of Unknown. Selected with
# `--pql-assert 0.9.1`. Function name and signature follow the released PQL.Assert 0.9.1
# package; python/tests/odcs/test_library_conformance.py checks them against a vendored copy.

library: PQL.Assert
min_version: "0.9.1"
extends: pql_assert_0_9

ops:
  rel.settings:
    fn: PQL.Assert.Relationship.ShouldExist
    args:
      - testName
      - fromTable
      - fromColumn
      - toTable
      - toColumn
      - fromCardinality
      - toCardinality
      - securityFilteringBehavior
      - crossFilteringBehavior
      - isActive

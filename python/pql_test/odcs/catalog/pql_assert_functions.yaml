# python/tests/odcs/test_function_matrix.py keeps this file in step with the vendored library
# and the catalogs: a function PQL.Assert adds fails that test until it is listed here.
#
#   params    number of parameters; optional  how many of them are optional (trailing)
#   use       mapped  an ODCS rule generates it (a catalog op other than dax.* calls it)
#             dax     only a `type: custom`, `engine: pql-test` rule calls it (a dax.* op,
#                     or a direct call)
#                     (implementation: {function, args}; pql-test supplies testName)
#             none    out of scope: model best practices (BP.*) take no testName and check
#                     the model's design, not its data; RetrieveTests* and LibraryVersion
#                     are discovery helpers, not assertions


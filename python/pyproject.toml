[build-system]
# setuptools >= 77 supports PEP 639 (license = "<SPDX>" + license-files)
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pql-test"
version = "0.1.17"
description = "CLI for discovering and running DAX tests in Power BI PBIP semantic models via XMLA"
readme = "README.md"
requires-python = ">=3.9"
license = "BUSL-1.1"
license-files = ["LICENSE.txt"]
keywords = ["power-bi", "fabric", "dax", "xmla", "testing", "pql", "semantic-model", "pbip"]
authors = [
    { name = "Client First Technologies" },
]
maintainers = [
    { name = "Giorgi Wolfe", email = "giorgi.wolfe@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyadomd>=0.0.5",
    "msal>=1.24.0",
    "azure-identity>=1.19.0",
    "keyring>=25.0.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage      = "https://github.com/clientfirsttech/PQL.Assert"
Repository    = "https://github.com/clientfirsttech/PQL.Assert"
Issues        = "https://github.com/clientfirsttech/PQL.Assert/issues"
Documentation = "https://github.com/clientfirsttech/PQL.Assert#readme"

[project.scripts]
pql-test = "pql_test.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[tool.setuptools]
packages = ["pql_test", "pql_test.auth"]

[tool.setuptools.package-data]
pql_test = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
markers = [
    "live: marks tests that need a real Power BI / Fabric XMLA connection. They auto-skip when PQL_* credentials aren't available, so plain `pytest` is safe to run; configure `.env` to opt them in.",
]

[tool.coverage.run]
source = ["pql_test"]
omit = ["tests/*"]

[tool.coverage.report]
# Fail if overall coverage drops below 80%
fail_under = 80
# Show lines that are not covered
show_missing = true
# Skip fully covered files from report
skip_covered = false
# Exclude specific patterns from coverage
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
